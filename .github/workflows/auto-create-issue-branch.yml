name: Auto Create Branch from Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create branch for issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Sanitize issue title using environment variables to avoid syntax errors with spaces/quotes
          SANITIZED_TITLE=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-\+/g')
          BRANCH_NAME="issue-${ISSUE_NUMBER}-${SANITIZED_TITLE}"
          
          # Truncate length
          BRANCH_NAME=$(echo "$BRANCH_NAME" | cut -c 1-50 | sed 's/-$//')

          echo "Creating branch: $BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and push remote branch
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"