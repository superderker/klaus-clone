name: Auto Create Branch from Issue

on:
  issues:
    types: [labeled]

jobs:
  create-branch:
    if: github.event.label.name == 'auto-branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create branch for issue
        run: |
          # Sanitize issue title to handle spaces and special characters
          TITLE=$(echo "${{ github.event.issue.title }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-\+/g')
          BRANCH_NAME="issue-${{ github.event.issue.number }}-${TITLE}"
          
          # Truncate branch name length if title is too long
          BRANCH_NAME=$(echo "$BRANCH_NAME" | cut -c 1-50)

          echo "Creating branch: $BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"