name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Gitleaks to scan git history fully

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest bandit -r test_requirements.txt || pip install ruff mypy pytest bandit

      - name: Run Ruff (Linter)
        run: ruff check .

      - name: Run mypy (Type Checker)
        run: mypy klaus

      - name: Run Bandit (SAST Security Scan)
        run: bandit -r klaus -ll

      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make runtests.sh executable
        run: chmod +x runtests.sh

      - name: Run Tests (Builds repos & runs pytest)
        run: ./runtests.sh -k "not ctags"

