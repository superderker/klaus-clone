services:
  klaus:
    build: .
    container_name: klaus-app
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ["klaus --host=0.0.0.0 --port=8080 /sample_repos/*"]
    volumes:
      - ./sample_repos:/sample_repos:ro
    networks:
      - klaus-net

  nginx:
    image: nginx:alpine
    container_name: klaus-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - klaus
    networks:
      - klaus-net

networks:
  klaus-net:
    driver: bridge